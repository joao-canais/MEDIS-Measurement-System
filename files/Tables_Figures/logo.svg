<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Gradiente Horizontal Suavizado -->
    <linearGradient id="smoothH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradiente Vertical Suavizado -->
    <linearGradient id="smoothV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <!-- Ponto Central Suave (Radial Glow) -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="1"/>
      <stop offset="35%" stop-color="#6ee7b7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Camada 1: Halo de Dispersão Suave (Traços mais longos e largos) -->
  <path stroke="url(#smoothH)" stroke-width="11" stroke-linecap="round" stroke-opacity="0.3" d="m3 68.3 114-16.6"/>
  <path stroke="url(#smoothV)" stroke-width="11" stroke-linecap="round" stroke-opacity="0.3" d="m66 3-12 114"/>

  <!-- Camada 2: Núcleo Fino do Laser -->
  <path stroke="url(#smoothH)" stroke-width="4" stroke-linecap="round" d="m3 68.3 114-16.6"/>
  <path stroke="url(#smoothV)" stroke-width="4" stroke-linecap="round" d="m66 3-12 114"/>

  <!-- Centro Suavizado -->
  <circle cx="60" cy="60" r="4" fill="url(#centerGlow)"/>
  <circle cx="60" cy="60" r="1.4" fill="#e9e9e9a6"/>
</svg>
