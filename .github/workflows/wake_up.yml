name: Wake Up Streamlit App

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Visit and Wake App
        run: |
          python - << 'EOF'
          import sys
          from playwright.sync_api import sync_playwright

          url = "https://medis-measurement-system.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=90000)

              wake_button = page.get_by_role("button", name="Yes, get this app back up")

              try:
                  wake_button.wait_for(state="visible", timeout=15000)
                  print("Activating the app...")
                  wake_button.click()
                  page.wait_for_timeout(10000)
                  print("App activated successfully.")
              except Exception:
                  print("The app is already active.")

              browser.close()
          EOF